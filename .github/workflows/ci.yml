name: CI

on:
  push:
    branches: [main]
    # A release tag (vX.Y.Z, matching pubspec.yaml) builds every platform's
    # artifacts; image.yml publishes the web image for it.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.2

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    outputs:
      brands: ${{ steps.brands.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      # Shared code must compile for the web: platform code goes behind
      # conditional imports in lib/platform/ instead.
      - name: No dart:io in lib/
        run: "! grep -rn \"import 'dart:io'\" lib/"
      - run: flutter test
      # The web implementations (lib/platform/*_web.dart), in Chrome.
      - run: flutter test --platform chrome test/web
      # p4n4 is the only committed brand. Client brands are themes that live with
      # their project; test/fixtures/brands/ holds example themes (acme) that
      # exercise every option through `install`.
      - name: Validate every brand
        id: brands
        # Lists folders directly: `dart run` can print build-hook progress to stdout.
        run: |
          dirs=$(find brands test/fixtures/brands -mindepth 1 -maxdepth 1 -type d | sort)
          for dir in $dirs; do dart run tool/brand.dart check "$dir"; done
          echo "list=$(for dir in $dirs; do basename "$dir"; done | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"
      # The repository ships with p4n4 applied; re-applying it must be a no-op.
      - name: Committed files match the p4n4 brand
        run: |
          dart run tool/brand.dart apply p4n4
          git status --porcelain
          test -z "$(git status --porcelain)" || { echo "::error::Run 'dart run tool/brand.dart apply p4n4' and commit the result"; exit 1; }

  build:
    name: Build ${{ matrix.platform }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # CanvasKit is bundled instead of loaded from Google's CDN, so the
          # build works on an offline LAN.
          - platform: web
            os: ubuntu-latest
            command: flutter build web --release --no-web-resources-cdn
            artifact: build/web
          - platform: linux
            os: ubuntu-latest
            command: flutter build linux --release
            artifact: build/linux/x64/release/bundle
          - platform: android
            os: ubuntu-latest
            # One APK per CPU architecture: each is a third the size of a universal APK.
            command: flutter build apk --release --split-per-abi
            artifact: build/app/outputs/flutter-apk/*-release.apk
          - platform: windows
            os: windows-latest
            command: flutter build windows --release
            artifact: build/windows/x64/runner/Release
          - platform: macos
            os: macos-latest
            command: flutter build macos --release
            artifact: build/macos/Build/Products/Release
          # Unsigned, so only proves the project compiles; nothing to install.
          - platform: ios
            os: macos-latest
            command: flutter build ios --release --no-codesign
    steps:
      - uses: actions/checkout@v7
      - if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev clang cmake pkg-config
      - if: matrix.platform == 'android'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: ${{ matrix.command }}
      - if: matrix.artifact
        uses: actions/upload-artifact@v7
        with:
          name: p4n4-dashboard-${{ matrix.platform }}
          path: ${{ matrix.artifact }}
          retention-days: 7

  brands:
    name: Brand ${{ matrix.brand }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        brand: ${{ fromJSON(needs.check.outputs.brands) }}
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev clang cmake pkg-config
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Apply ${{ matrix.brand }}
        run: |
          if [ -d "brands/${{ matrix.brand }}" ]; then
            dart run tool/brand.dart apply ${{ matrix.brand }}
          else
            dart run tool/brand.dart install test/fixtures/brands/${{ matrix.brand }} --apply
          fi
      # Layout tests render the applied brand, so they cover its tabs and palette.
      - run: flutter test
      - run: flutter build linux --release
