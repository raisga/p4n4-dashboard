name: Image

# The p4n4-dashboard web image (Dockerfile) on GHCR, for linux/amd64 and
# linux/arm64 (Raspberry Pi 5):
#   - push to main  → :edge
#   - tag vX.Y.Z    → :X.Y.Z, :X.Y, :latest (the tag must match pubspec.yaml)
#   - pull request  → build and smoke-test only, nothing pushed
#
# Only the public p4n4 brand is published here. Build client brands
# (`make image THEME=…`) into a private registry, so one client's branding
# never sits next to another's.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/p4n4-dashboard

jobs:
  image:
    name: Build, test and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # pubspec.yaml is the source of truth for the version; a release tag must agree.
      - name: Version
        id: version
        run: |
          version=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match pubspec.yaml version $version"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      # The web output is architecture-independent and the Flutter stage runs
      # on the runner's platform (BUILDPLATFORM), so arm64 needs no QEMU: only
      # the final nginx stage is per-architecture, and it has no RUN steps.
      - name: Build for the smoke test (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: p4n4-dashboard:smoke
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8088:8080 p4n4-dashboard:smoke
          trap 'docker logs smoke; docker rm -f smoke >/dev/null' EXIT
          for _ in $(seq 30); do curl -fsS localhost:8088/healthz && break; sleep 1; done
          curl -fsS localhost:8088/healthz
          curl -fsS localhost:8088/config.json | jq -e '.defaults.apiBase == "/"'
          curl -fsS localhost:8088/ | grep -q '<title>p4n4 dashboard</title>'
          curl -fsS localhost:8088/some/app/route | grep -q flutter_bootstrap.js
          # Upstreams are down here: the proxy must fail cleanly, not take nginx with it
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8088/api/v1/stacks)" = 502
          curl -fsS localhost:8088/healthz
          curl -fsSI localhost:8088/ | grep -qi '^content-security-policy:'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8088/grafana/)" = 404   # off unless GRAFANA_UPSTREAM

      - name: Smoke test (basic auth)
        run: |
          hash=$(docker run --rm --entrypoint htpasswd httpd:2.4-alpine -nbB ci ci-pass)
          docker run -d --name smoke-auth -p 8089:8080 -e DASHBOARD_BASIC_AUTH="$hash" p4n4-dashboard:smoke
          trap 'docker logs smoke-auth; docker rm -f smoke-auth >/dev/null' EXIT
          for _ in $(seq 30); do curl -fsS localhost:8089/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8089/)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -u ci:wrong localhost:8089/)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -u ci:ci-pass localhost:8089/)" = 200
          curl -fsS localhost:8089/healthz   # stays open for health checks

      - name: Scan for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: p4n4-dashboard:smoke
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64, arm64)
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
