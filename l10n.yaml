# `flutter gen-l10n` (run by `flutter pub get` and every build): one ARB file
# per language in lib/l10n/, English being the template every other one follows.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
nullable-getter: false
# Same 120-column style as the rest of lib/ (CI checks it).
format: true
