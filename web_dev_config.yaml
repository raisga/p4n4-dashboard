# Dev server proxy (`flutter run -d chrome` / `-d web-server`, or `make run`):
# the same routes as the container's nginx, so dev and production use the
# same same-origin paths and the services need no CORS. `make run` also
# passes --dart-define=P4N4_DEV_PROXY=true so the app uses these paths.
#
# Grafana, Node-RED and n8n are used through these routes only once their
# base URL says so (Settings → Endpoints: /grafana/, /svc/node-red/,
# /svc/n8n/) and the service serves from that path, as with the container.
# Unlike nginx, this proxy passes no WebSockets (Node-RED's editor says it
# lost its connection, n8n falls back to polling or doesn't update live) and
# rewrites no headers; being same-origin, the pages still frame.
server:
  proxy:
    - prefix: /api/
      target: http://localhost:8000/
    - prefix: /health
      target: http://localhost:8000/
    - prefix: /swagger-ui
      target: http://localhost:8000/
    - prefix: /openapi.json
      target: http://localhost:8000/
    - prefix: /grafana/
      target: http://localhost:3000/
    - prefix: /svc/node-red/
      target: http://localhost:1880/
    # n8n links to N8N_PATH but serves from its root, as nginx strips it
    - prefix: /svc/n8n/
      target: http://localhost:5678/
      replace: /
