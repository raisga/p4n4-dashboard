# Included by the server block and by every location that sets its own
# add_header (which would otherwise drop the server's). Not used for
# /grafana/, /svc/ or Swagger UI (embed_proxy.conf): those pages need their
# own scripts (inline, eval, a CDN), and only frame themselves.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy same-origin always;
# Enforced; checked in Chromium against every tab (no violations). Cameras
# load from other origins (img-src for MJPEG and snapshots, media-src for
# video files and the demo cameras); the services are same-origin but may be
# configured elsewhere (connect-src http: https:). Frames come only from this
# origin and the embeddable services' own ($dashboard_frame_src, see
# default.conf.template), never from just any site.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src * data: blob:; media-src http: https:; connect-src 'self' http: https:; frame-src 'self' $dashboard_frame_src; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
