# Included by the server block and by every location that sets its own
# add_header (which would otherwise drop the server's). Not used for
# /grafana/: Grafana's pages need inline scripts and eval, and frame
# themselves.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy same-origin always;
# Enforced; checked in Chromium against every tab (no violations). Grafana and
# cameras load from other origins (frame-src; img-src for MJPEG and snapshots,
# media-src for video files and the demo cameras); the services are
# same-origin but may be configured elsewhere (connect-src http: https:).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src * data: blob:; media-src http: https:; connect-src 'self' http: https:; frame-src http: https:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
