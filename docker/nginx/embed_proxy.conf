# Shared by the services shown in the app's viewer on this origin (/grafana/,
# /svc/<id>/, Swagger UI): their own pages, headers and scripts, not the
# dashboard's CSP (security_headers.conf).
proxy_http_version 1.1;
# Grafana and n8n check Origin against Host (CSRF), so keep the browser's Host
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Forwarded-Host $http_host;
# Never the p4n4-api token (X-Upstream-Authorization) or the basic auth
# credentials; a service's own bearer token (Node-RED's editor) passes.
proxy_set_header Authorization $authorization_without_basic;
proxy_set_header X-Upstream-Authorization "";
# WebSockets: Grafana Live, Node-RED's editor, n8n's push
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_read_timeout 300s;
# Framing: the dashboard (same origin) may show these pages, other sites may
# not. The service's own X-Frame-Options (DENY, SAMEORIGIN) is replaced; a
# frame-ancestors policy it sends is kept, and adds to this one.
proxy_hide_header X-Frame-Options;
add_header X-Frame-Options SAMEORIGIN always;
add_header Content-Security-Policy "frame-ancestors 'self'" always;
# The dashboard's own, unless the service sends them (n8n's no-referrer is
# stricter): an empty value adds nothing.
add_header X-Content-Type-Options $embed_nosniff always;
add_header Referrer-Policy $embed_referrer_policy always;
